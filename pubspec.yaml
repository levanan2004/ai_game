name: ai_game
description: "Tiệm Hoa: a cozy flower-shop game (Flutter + Flame, web first)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  flame: ^1.38.2
  shared_preferences: ^2.5.5
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  audioplayers: ^6.8.1
  firebase_auth: ^6.7.0
  firebase_storage: ^13.6.0
  image_picker: ^1.2.3
  image: ^4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Game data from Hà Phương, read at runtime (never hard-coded).
  assets:
    - assets/data/economy.json
    - assets/data/reviews.json
    - assets/data/orders.json
    # Art v0.1 by Phú (PNG 256px, file name = id in economy.json;
    # customers/index.json maps customer name -> avatarId).
    - assets/images/customers/
    # Full-body queue sprites (256×480), same avatarIds as customers/.
    - assets/images/customers_full/
    - assets/images/flowers/
    - assets/images/papers/
    - assets/images/ribbons/
    - assets/images/upgrades/
    # Bottom-bar icons v0.1 (PNG 128px, shown at 28px).
    - assets/images/nav/
    # Scene backgrounds (Phu), drawn at 3x.
    - assets/images/scenes/
    # Shipper vehicles (Phú, PNG 128px, shown at 40 or 56).
    - assets/images/shippers/
    # Đại thiện nhân QR (shown uncropped).
    - assets/images/donate/
    # Background music. Drop bgm_main.mp3 here later; a missing file is silent.
    - assets/audio/

  # Fonts from design_tokens.json (OFL, from github.com/google/fonts).
  fonts:
    - family: Baloo 2
      fonts:
        - asset: assets/fonts/baloo2/Baloo2-VariableFont_wght.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/nunito/Nunito-VariableFont_wght.ttf
