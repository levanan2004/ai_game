name: ai_game
description: "Tiệm Hoa: a cozy flower-shop game (Flutter + Flame, web first)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  flame: ^1.38.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Game data from Hà Phương, read at runtime (never hard-coded).
  assets:
    - assets/data/economy.json
    - assets/data/reviews.json
    - assets/data/orders.json
    # Art v0.1 by Phú (PNG 256px, file name = id in economy.json;
    # customers/index.json maps customer name -> avatarId).
    - assets/images/customers/
    - assets/images/flowers/
    - assets/images/papers/
    - assets/images/ribbons/
    - assets/images/upgrades/
    # Bottom-bar icons v0.1 (PNG 128px, shown at 28px).
    - assets/images/nav/

  # Fonts from design_tokens.json (OFL, from github.com/google/fonts).
  fonts:
    - family: Baloo 2
      fonts:
        - asset: assets/fonts/baloo2/Baloo2-VariableFont_wght.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/nunito/Nunito-VariableFont_wght.ttf
