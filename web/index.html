  <script>
    (function () {
      var deferred = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferred = e;
        window.dispatchEvent(new Event('pwa-install-ready'));
      });
      window.addEventListener('appinstalled', function () {
        deferred = null;
        window.dispatchEvent(new Event('pwa-installed'));
      });
      window.pwaCanPrompt = function () { return !!deferred; };
      window.pwaIsInstalled = function () {
        return window.matchMedia('(display-mode: standalone)').matches
          || window.navigator.standalone === true;
      };
      window.pwaPlatform = function () {
        var ua = navigator.userAgent || '';
        var iPad = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
        if (/iPhone|iPad|iPod/.test(ua) || iPad) return 'ios';
        if (/Android/i.test(ua)) return 'android';
        return 'other';
      };
      window.pwaPromptInstall = function () {
        if (!deferred) return Promise.resolve('unavailable');
        var promptEvent = deferred;
        deferred = null;
        promptEvent.prompt();
        return promptEvent.userChoice.then(function (choice) {
          return (choice && choice.outcome) || 'dismissed';
        });
      };
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    * https://docs.flutter.dev/platform-integration/web/initialization

  <script>
    // A leftover service worker would keep serving the previous build.
    // Drop it once, reload, then start the game. The save stays in the browser.
    (function () {
      function start() {
        var boot = document.createElement('script');
        boot.async = true;
        function go(src) {
          boot.src = src;
          document.body.appendChild(boot);
        }
        // index.html is not kept for hours. Ask for the loader from the
        // network, then load that exact build so an old cached copy is unused.
        fetch('flutter_bootstrap.js', { cache: 'no-cache', credentials: 'same-origin' })
          .then(function (res) {
            var tag = res.headers.get('etag') || String(Date.now());
            go('flutter_bootstrap.js?v=' + encodeURIComponent(tag));
          })
          .catch(function () {
            go('flutter_bootstrap.js?v=' + Date.now());
          });
      }
      if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) {
        try { sessionStorage.removeItem('thsm-sw-reload'); } catch (e) {}
        start();
        return;
      }
      var again = false;
      try { again = sessionStorage.getItem('thsm-sw-reload') === '1'; } catch (e) {}
      if (again) {
        try { sessionStorage.removeItem('thsm-sw-reload'); } catch (e) {}
        start();
        return;
      }
      try { sessionStorage.setItem('thsm-sw-reload', '1'); } catch (e) {}
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
      }).then(function () {
        location.reload();
      }).catch(start);
    })();
  </script>
