  <meta charset="UTF-8">

  <!-- Open Graph (link previews) -->

  <meta property="og:description" content="Sáng ra chợ nhập hoa, bó hoa cho khách theo dịp sinh nhật, 8/3, 20/10, Tết và giữ hoa luôn tươi. Chơi thử bản alpha ngay trên trình duyệt.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">

  <title>Tiệm Hoa Sớm Mai – Game tiệm hoa, bó hoa theo dịp (chơi thử alpha)</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #F8F5EA; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #3F7F52; transition: opacity 250ms ease;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading h1 { margin: 0; font-size: 28px; font-weight: 800; text-align: center; line-height: 1.15; }
    #loading p { margin: 0; font-size: 14px; color: #8A7670; }
    #loading .dots span {
      display: inline-block; width: 8px; height: 8px; margin: 0 3px;
      border-radius: 50%; background: #E8738A; animation: pulse 1s infinite ease-in-out;
    }
    #loading .dots span:nth-child(2) { animation-delay: .15s; }
    #loading .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes pulse { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
    #site-links { position: absolute; bottom: 16px; font-size: 12px; color: #8A7670; }
    #site-links a { color: #8A7670; }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="loading">
    <h1>Tiệm Hoa<br>Sớm Mai</h1>
    <div class="dots"><span></span><span></span><span></span></div>
    <p id="loading-text">Đang mở cửa tiệm…</p>
    <nav id="site-links"><a href="privacy.html">Chính sách quyền riêng tư</a> · <a href="about.html">Giới thiệu</a> · <a href="contact.html">Liên hệ</a></nav>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      el.classList.add('done');
      setTimeout(function () { el.remove(); }, 300);
    });
    setTimeout(function () {
      var t = document.getElementById('loading-text');
      if (t) t.textContent = 'Mạng hơi chậm, bạn đợi thêm chút hoặc tải lại trang nhé.';
    }, 15000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
